; Projet exemple : utilisation de AmpereHeure.h
; La librairie CoulombsAh est la racine du dépôt (src/ contient les .h).
; Chemins relatifs depuis exemples/AmpereHeure/ vers la racine : ../..

[env:d1_mini]
