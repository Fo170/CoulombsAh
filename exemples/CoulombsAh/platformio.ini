; Projet exemple : utilisation de CoulombsAh.h + Persistance
; La librairie CoulombsAh est la racine du dépôt (src/ contient le .h).
; Persistance est une dépendance externe (Fo170/Persistance), épinglée sur un
; tag EXACT : elle n'est pas au registre PlatformIO.

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../..
lib_deps =
    https://github.com/Fo170/Persistance.git#v1.0.1
