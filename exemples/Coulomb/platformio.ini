; Projet exemple : utilisation de Coulomb.h + Persistance
; La librairie CoulombsAh est la racine du dépôt (src/ contient les .h).
; Persistance est une dépendance externe (Fo170/Persistance).

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../..
lib_deps =
    Fo170/Persistance >= 1.0
